# CADRE-Risk override for VerifyWise (AI governance sink)
# Upstream: https://github.com/verifywise-ai/verifywise
# Ports avoid CISO Assistant (:8080).

name: Risk

services:
  postgresdb:
    container_name: cadre-risk-vw-postgres
  redis:
    container_name: cadre-risk-vw-redis
  backend:
    container_name: cadre-risk-vw-backend
    ports: !override
      - "127.0.0.1:13000:3000"
  frontend:
    container_name: cadre-risk-vw-frontend
    ports: !override
      - "127.0.0.1:18080:80"
    # Fix upstream image nginx.conf (proxy_pass localhost:3000 → 502)
    volumes:
      # Path injected by scripts/verifywise-up.ps1 as $env:VW_NGINX_CONF so the repo
      # can live anywhere; compose project dir is vendor/verifywise when up.ps1 runs.
      - ${VW_NGINX_CONF:-./verifywise-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
  worker:
    container_name: cadre-risk-vw-worker
  eval_server:
    container_name: cadre-risk-vw-eval
  ai_gateway:
    container_name: cadre-risk-vw-gateway
