# CADRE-Risk override — HTTP lab mode (no TLS)
# Official default is https://localhost:8443; HTTP used here because Firefox
# hits SSL_ERROR_INTERNAL_ERROR_ALERT with Caddy tls internal on Windows.
# Upstream: https://github.com/intuitem/ciso-assistant-community

name: cadre-risk-ciso

services:
  backend:
    container_name: cadre-risk-ciso-backend
    environment:
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
      - CISO_ASSISTANT_URL=http://localhost:8080
  huey:
    container_name: cadre-risk-ciso-huey
    environment:
      - ALLOWED_HOSTS=backend,localhost,127.0.0.1
      - CISO_ASSISTANT_URL=http://localhost:8080
  frontend:
    container_name: cadre-risk-ciso-frontend
    environment:
      - PUBLIC_BACKEND_API_URL=http://backend:8000/api
      - PUBLIC_BACKEND_API_EXPOSED_URL=http://localhost:8080/api
  qdrant:
    container_name: cadre-risk-ciso-qdrant
    ports: !override
      - "127.0.0.1:6333:6333"
  caddy:
    container_name: cadre-risk-ciso-caddy
    environment:
      - CISO_ASSISTANT_URL=http://localhost:8080
    ports: !override
      - "127.0.0.1:8080:8080"
    command: |
      sh -c 'echo ":8080 {
      reverse_proxy /api/* backend:8000
      reverse_proxy /* frontend:3000
      }" > Caddyfile && caddy run --config Caddyfile'
