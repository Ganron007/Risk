# CADRE-Risk — asset → owner → classification → default controls
# R2-S1.5 — machine-readable map for risk_engine / GRC sink export

version: 1
classification_rank:
  Restricted: 3
  Confidential: 2
  Internal: 1

# Default NIST CSF functions referenced by control register
nist_csf_functions:
  - ID  # Identify
  - PR  # Protect
  - DE  # Detect
  - RS  # Respond
  - RC  # Recover

assets:
  AST-001:
