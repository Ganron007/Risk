<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="CADRE-Risk logo">
  <defs>
    <!-- Base Shield Gradient (Dark Teal) -->
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="55%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <!-- Wordmark Gradient -->
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Shield icon with GRC balance scale and AI sparkle -->
  <g transform="translate(24,28)">
    <!-- Sleek outer shield path -->
    <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z"
          fill="url(#tealGrad)" stroke="#042f2e" stroke-width="2"/>
          
    <!-- AI Sparkle in upper-right area -->
    <path d="M85 24 Q85 32 93 32 Q85 32 85 40 Q85 32 77 32 Q85 32 85 24 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Balance Scale (Risk/GRC Business Theme) -->
    <!-- Pillar -->
    <line x1="55" y1="35" x2="55" y2="100" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
    <!-- Pillar Base -->
    <line x1="38" y1="100" x2="72" y2="100" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <!-- Crossbar -->
    <line x1="25" y1="45" x2="85" y2="45" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <!-- Scale Pivot Point -->
    <circle cx="55" cy="45" r="4.5" fill="#0f766e" stroke="#ffffff" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Left Scale Pan -->
    <path d="M25 45 L15 80 H35 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="12" y1="80" x2="38" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
    
    <!-- Right Scale Pan -->
    <path d="M85 45 L75 80 H95 Z" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <line x1="72" y1="80" x2="98" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="url(#wordGrad)" letter-spacing="-1">Risk</text>
        
  <!-- Tagline under the wordmark -->
  <text x="162" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.4">Hands-on GRC &amp; Risk Assessment Sandbox</text>
</svg>
